- name: Criar usuário
  run: |
    sudo useradd -m -s /bin/bash user || true
    echo 'user:Temp123!' | sudo chpasswd
    sudo usermod -aG sudo user || true
    echo "✅ Local user created: user"

- name: Instalar Bore
  run: |
    set -euxo pipefail

    if ! command -v bore >/dev/null 2>&1; then
      cargo install bore-cli
      echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    fi

    bore --version

- name: Iniciar túnel Bore
  shell: bash
  run: |
    set -euo pipefail

    LOG="/tmp/bore_output.txt"
    rm -f "$LOG"

    echo "🚀 Iniciando bore..."

    bore local 22 --to bore.pub >"$LOG" 2>&1 &
    BORE_PID=$!

    echo "BORE_PID=$BORE_PID" >> "$GITHUB_ENV"

    # Espera até 30s pela inicialização
    PUBLIC_PORT=""

    for i in {1..30}; do
      # Verifica se o processo morreu
      if ! kill -0 "$BORE_PID" 2>/dev/null; then
        echo "❌ Bore encerrou antes de disponibilizar a porta."
        echo "----- bore output -----"
        cat "$LOG" || true
        echo "-----------------------"
        exit 1
      fi

      # Bore normalmente informa algo como:
      # tcp://bore.pub:<porta>
      PUBLIC_PORT=$(grep -oE 'bore\.pub:[0-9]+' "$LOG" \
        | head -1 \
        | cut -d: -f2 || true)

      # Fallback para formatos que contenham apenas "port XXXXX"
      if [ -z "$PUBLIC_PORT" ]; then
        PUBLIC_PORT=$(grep -oE 'port[[:space:]]+[0-9]+' "$LOG" \
          | head -1 \
          | grep -oE '[0-9]+$' || true)
      fi

      if [[ "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
        break
      fi

      sleep 1
    done

    echo "----- bore output -----"
    cat "$LOG" || true
    echo "-----------------------"

    if ! [[ "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
      echo "❌ Não foi possível obter a porta pública do Bore."
      exit 1
    fi

    echo "✅ Bore iniciado"
    echo "🌐 Host: bore.pub"
    echo "🔌 Porta pública: $PUBLIC_PORT"

    {
      echo "PUBLIC_HOST=bore.pub"
      echo "PUBLIC_PORT=$PUBLIC_PORT"
    } >> "$GITHUB_ENV"

- name: Validar túnel
  run: |
    echo "PUBLIC_HOST=$PUBLIC_HOST"
    echo "PUBLIC_PORT=$PUBLIC_PORT"

    if [ -z "${PUBLIC_PORT:-}" ]; then
      echo "❌ PUBLIC_PORT não definida"
      exit 1
    fi

    echo "✅ Túnel disponível em:"
    echo "ssh -p $PUBLIC_PORT user@bore.pub"
