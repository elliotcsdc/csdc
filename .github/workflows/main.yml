name: windows-maintenance

on:
  workflow_dispatch:

jobs:
  system-check:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Performance Tuning
        shell: powershell
        run: |
          $reg1 = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $reg2 = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          
          Set-ItemProperty -Path $reg1 -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path $reg2 -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path $reg2 -Name "SecurityLayer" -Value 0 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Enable-NetFirewallRule
          
          Restart-Service -Name TermService -Force

      - name: Account Management
        shell: powershell
        run: |
          $pwd = "Temp123!"
          $sec = ConvertTo-SecureString $pwd -AsPlainText -Force
          
          $user = "user"
          if (!(Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $user -Password $sec -AccountNeverExpires
          }
          
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          
          Write-Host "Account: $user / $pwd"

      - name: Network Tools
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $file = "$env:TEMP\setup.msi"
          
          Invoke-WebRequest -Uri $url -OutFile $file
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$file`" /quiet /norestart" -Wait
          Remove-Item -Path $file -Force

      - name: Connect Service
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --auth-key=${{ secrets.oi_TAILSCALE_AUTH_KEY }} --hostname=win-${{ github.run_id }}
          
          $ip = ""
          for ($i=0; $i -lt 20; $i++) {
              $ip = & $ts ip -4
              if ($ip) { break }
              Start-Sleep -Seconds 5
          }
          
          if (!$ip) { throw "Connection failed" }
          
          Write-Host "Service Address: $ip"
          Write-Host "Access: user / Temp123!"

      - name: Health Check
        shell: powershell
        run: |
          Get-Service TermService | Out-Null
          Test-NetConnection -ComputerName localhost -Port 3389 | Out-Null
          Write-Host "System Ready"

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] System running"
              Start-Sleep -Seconds 300
          }
