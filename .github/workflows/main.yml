name: linux-ssh-tunnel

on:
  workflow_dispatch:

jobs:
  system-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Bore
        shell: bash
        run: |
          # Baixar bore (versão correta para Linux)
          curl -L https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp
          sudo mv /tmp/bore /usr/local/bin/
          sudo chmod +x /usr/local/bin/bore
          
          # Verificar instalação
          /usr/local/bin/bore --version || echo "Bore installed"
          
          echo "✅ Bore installed successfully"

      - name: Performance Tuning
        shell: bash
        run: |
          # Configurar SSH (corrigido para Ubuntu)
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config || echo "Already set"
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config || echo "Already set"
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config || echo "Already set"
          
          # Reiniciar SSH (usando ssh.service no Ubuntu)
          sudo systemctl restart ssh || sudo service ssh restart
          
          # Verificar status
          sudo systemctl status ssh || sudo service ssh status
          
          echo "✅ SSH configured"

      - name: Account Management
        shell: bash
        run: |
          USER="user"
          PASS="Temp123!"
          
          # Criar usuário
          if ! id "$USER" &>/dev/null; then
              sudo useradd -m -s /bin/bash "$USER"
              echo "$USER:$PASS" | sudo chpasswd
              sudo usermod -aG sudo "$USER"
          fi
          
          # Garantir permissões
          sudo usermod -aG sudo "$USER"
          
          echo "✅ Local user: $USER"
          echo "✅ Password: $PASS"

      - name: Create SSH Tunnel with Bore
        shell: bash
        run: |
          # Iniciar bore em background com saída para arquivo
          /usr/local/bin/bore local 22 --to bore.pub > /tmp/bore_output.txt 2>&1 &
          BORE_PID=$!
          
          echo $BORE_PID > /tmp/bore.pid
          
          # Aguardar bore iniciar
          sleep 10
          
          # Mostrar saída para debug
          echo "Bore output:"
          cat /tmp/bore_output.txt
          
          # Extrair a porta pública
          PUBLIC_PORT=$(grep -oE 'port [0-9]+' /tmp/bore_output.txt | head -1 | awk '{print $2}')
          
          if [ -z "$PUBLIC_PORT" ]; then
              echo "❌ Failed to get public port"
              # Tentar método alternativo
              PUBLIC_PORT=$(grep -oE '[0-9]{4,5}' /tmp/bore_output.txt | head -1)
          fi
          
          if [ -z "$PUBLIC_PORT" ]; then
              echo "❌ No port found in bore output"
              cat /tmp/bore_output.txt
              exit 1
          fi
          
          echo "PUBLIC_PORT=$PUBLIC_PORT" >> $GITHUB_ENV
          echo "PUBLIC_HOST=bore.pub" >> $GITHUB_ENV
          
          echo "✅ Tunnel created on port: $PUBLIC_PORT"

      - name: Health Check
        shell: bash
        run: |
          # Verificar SSH
          sudo systemctl status ssh || sudo service ssh status
          
          # Testar conexão local
          nc -zv localhost 22 && echo "✅ SSH running on port 22" || echo "❌ SSH not running"
          
          echo "✅ System ready"

      - name: Display Access Information
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "           🚀 SSH ACCESS INFORMATION 🚀           "
          echo "=================================================="
          echo ""
          echo "📍 PUBLIC ADDRESS:"
          echo "   Host: bore.pub"
          echo "   Port: ${{ env.PUBLIC_PORT }}"
          echo ""
          echo "🔑 CREDENTIALS:"
          echo "   User: user"
          echo "   Password: Temp123!"
          echo ""
          echo "📝 CONNECTION COMMAND:"
          echo "   ssh user@bore.pub -p ${{ env.PUBLIC_PORT }}"
          echo ""
          echo "🔓 OR (if above fails):"
          echo "   ssh -o StrictHostKeyChecking=no user@bore.pub -p ${{ env.PUBLIC_PORT }}"
          echo ""
          echo "⚠️  IMPORTANT NOTES:"
          echo "   - Password: Temp123!"
          echo "   - Tunnel active while this workflow runs"
          echo "   - May take 10-30 seconds to become available"
          echo "=================================================="

      - name: Keep Alive
        shell: bash
        run: |
          echo "🔄 SSH Tunnel Active"
          echo "   bore.pub:${{ env.PUBLIC_PORT }}"
          echo "   ssh user@bore.pub -p ${{ env.PUBLIC_PORT }}"
          echo "   Password: Temp123!"
          echo ""
          echo "⏰ Keeping tunnel alive..."
          
          while true; do
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] ✅ Tunnel: bore.pub:${{ env.PUBLIC_PORT }}"
              echo "   ➜ ssh user@bore.pub -p ${{ env.PUBLIC_PORT }} (pass: Temp123!)"
              sleep 60
          done
