name: linux-maintenance

on:
  workflow_dispatch:

jobs:
  system-check:
    runs-on: ubuntu-latest  # Mudando para Linux
    timeout-minutes: 3600

    steps:
      - name: Performance Tuning
        shell: bash
        run: |
          # Ajustes de performance para SSH
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          
          # Liberar porta SSH no firewall
          sudo ufw allow 22/tcp || sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT
          
          # Reiniciar SSH
          sudo systemctl restart sshd || sudo service ssh restart

      - name: Account Management
        shell: bash
        run: |
          USER="user"
          PASS="Temp123!"
          
          # Criar usuário se não existir
          if ! id "$USER" &>/dev/null; then
              sudo useradd -m -s /bin/bash "$USER"
              echo "$USER:$PASS" | sudo chpasswd
              sudo usermod -aG sudo "$USER"
          fi
          
          # Garantir que o usuário está no grupo sudo
          sudo usermod -aG sudo "$USER"
          
          echo "Account: $USER / $PASS"

      - name: Network Tools
        shell: bash
        run: |
          # Instalar Tailscale no Linux
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # Instalar outras ferramentas úteis
          sudo apt-get update
          sudo apt-get install -y net-tools openssh-server htop

      - name: Connect Service
        shell: bash
        run: |
          # Autenticar Tailscale
          sudo tailscale up --auth-key=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=linux-${{ github.run_id }}
          
          # Aguardar IP
          IP=""
          for i in {1..20}; do
              IP=$(tailscale ip -4 2>/dev/null || echo "")
              if [ -n "$IP" ]; then
                  break
              fi
              sleep 5
          done
          
          if [ -z "$IP" ]; then
              echo "Connection failed"
              exit 1
          fi
          
          echo "Service Address: $IP"
          echo "SSH Access: ssh user@$IP -p 22"
          echo "Password: Temp123!"

      - name: Health Check
        shell: bash
        run: |
          # Verificar serviços
          sudo systemctl status sshd || sudo service ssh status
          sudo systemctl status tailscaled
          
          # Testar conexão SSH local
          nc -zv localhost 22 || echo "SSH port not listening"
          
          echo "System Ready"

      - name: Keep Alive
        shell: bash
        run: |
          while true; do
              echo "[$(date)] System running - SSH available"
              echo "Connect via: ssh user@$(tailscale ip -4 2>/dev/null || echo 'IP')"
              sleep 300
          done
