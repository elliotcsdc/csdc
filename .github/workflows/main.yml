name: windows-maintenance

on:
  workflow_dispatch:

jobs:
  system-check:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: System Config
        shell: powershell
        run: |
          $r1 = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $r2 = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $r1 -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path $r2 -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path $r2 -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tunnel" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tunnel" dir=in action=allow protocol=TCP localport=3389
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Enable-NetFirewallRule
          Restart-Service -Name TermService -Force

      - name: User Setup
        shell: powershell
        run: |
          $p = "Temp123!"
          $s = ConvertTo-SecureString $p -AsPlainText -Force
          $u = "user"
          if (!(Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $u -Password $s -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue

      - name: Install noVNC
        shell: powershell
        run: |
          # Baixa e instala o TightVNC (servidor VNC para Windows)
          $vnc_url = "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $vnc_url -OutFile "tightvnc.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"tightvnc.msi`" /quiet /norestart" -Wait
          
          # Baixa noVNC (cliente web)
          $novnc_url = "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip"
          Invoke-WebRequest -Uri $novnc_url -OutFile "novnc.zip"
          Expand-Archive "novnc.zip" -Force
          Move-Item "noVNC-1.5.0" "novnc" -Force
          Remove-Item "novnc.zip" -Force

      - name: Configure VNC
        shell: powershell
        run: |
          # Configura senha do VNC
          $vnc_pass = "Temp123!"
          
          # Cria arquivo de configuração do VNC
          @"
          [HKEY_CURRENT_USER\Software\TightVNC\Server]
          "Password"=hex:$( 
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($vnc_pass)
              $hash = New-Object System.Security.Cryptography.MD5CryptoServiceProvider
              $hash_bytes = $hash.ComputeHash($bytes)
              -join ($hash_bytes | ForEach-Object { $_.ToString("X2") })
          )
          "UseVncAuthentication"=dword:00000001
          "AllowLoopback"=dword:00000001
          "@ | Out-File -FilePath "vnc_config.reg"
          
          reg import vnc_config.reg
          
          # Inicia servidor VNC
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-service"
          Start-Sleep -Seconds 3

      - name: Install Cloudflare Tunnel
        shell: powershell
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "cld.exe"

      - name: Start Cloudflare Tunnel
        shell: powershell
        run: |
          # Inicia noVNC na porta 6080 (VNC web)
          $c = ".\cld.exe"
          $a = "tunnel --url http://localhost:6080"
          Start-Process -FilePath $c -ArgumentList $a -NoNewWindow
          Start-Sleep -Seconds 10
          
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VNC Web Access Active!"
          Write-Host ""
          Write-Host "Access via browser:"
          Write-Host "https://*.trycloudflare.com/vnc.html"
          Write-Host ""
          Write-Host "VNC Password: Temp123!"
          Write-Host "=========================================="

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] System running"
              Start-Sleep -Seconds 300
          }
