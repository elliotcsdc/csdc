name: SSH Linux via Bore

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_USER: tunnel
      SSH_PORT: "2222"
      BORE_HOST: bore.pub

    steps:

      # ============================================================
      # 1. Instalação
      # ============================================================
      - name: Instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server \
            openssh-client \
            curl \
            ca-certificates \
            netcat-openbsd \
            procps \
            jq

          echo "✅ Dependências instaladas"

      # ============================================================
      # 2. Instalar Rust + Bore
      # ============================================================
      - name: Instalar Bore
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.cargo/bin:$PATH"

          if ! command -v cargo >/dev/null 2>&1; then
            echo "📦 Instalando Rust..."

            curl --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y

            source "$HOME/.cargo/env"
          fi

          echo "Rust:"
          rustc --version

          echo "Cargo:"
          cargo --version

          if ! command -v bore >/dev/null 2>&1; then
            echo "📦 Instalando bore-cli..."

            cargo install bore-cli
          fi

          export PATH="$HOME/.cargo/bin:$PATH"

          if ! command -v bore >/dev/null 2>&1; then
            echo "❌ Bore não foi instalado."
            exit 1
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          echo "Bore:"
          bore --version

      # ============================================================
      # 3. Criar usuário
      # ============================================================
      - name: Criar usuário SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          if id "$SSH_USER" >/dev/null 2>&1; then
            sudo userdel -r "$SSH_USER" 2>/dev/null || true
          fi

          sudo useradd \
            --create-home \
            --shell /bin/bash \
            "$SSH_USER"

          sudo install -d \
            -m 700 \
            -o "$SSH_USER" \
            -g "$SSH_USER" \
            "/home/$SSH_USER/.ssh"

          echo "✅ Usuário criado: $SSH_USER"

      # ============================================================
      # 4. Criar chave SSH
      # ============================================================
      - name: Gerar chave ED25519
        shell: bash
        run: |
          set -Eeuo pipefail

          KEY_DIR="$RUNNER_TEMP/bore-ssh"

          rm -rf "$KEY_DIR"
          mkdir -p "$KEY_DIR"

          chmod 700 "$KEY_DIR"

          ssh-keygen \
            -q \
            -t ed25519 \
            -N "" \
            -f "$KEY_DIR/id_ed25519" \
            -C "github-actions-bore"

          sudo cp \
            "$KEY_DIR/id_ed25519.pub" \
            "/home/$SSH_USER/.ssh/authorized_keys"

          sudo chown \
            "$SSH_USER:$SSH_USER" \
            "/home/$SSH_USER/.ssh/authorized_keys"

          sudo chmod 600 \
            "/home/$SSH_USER/.ssh/authorized_keys"

          echo "SSH_KEY=$KEY_DIR/id_ed25519" >> "$GITHUB_ENV"

          echo "✅ Chave SSH configurada"

      # ============================================================
      # 5. Configurar sshd
      # ============================================================
      - name: Configurar SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo mkdir -p /run/sshd

          sudo tee /etc/ssh/sshd_config.d/github-bore.conf > /dev/null <<EOF
          Port $SSH_PORT
          ListenAddress 127.0.0.1

          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no

          PermitRootLogin no
          PermitEmptyPasswords no

          AllowUsers $SSH_USER

          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no
          PermitTunnel no

          ClientAliveInterval 30
          ClientAliveCountMax 3

          LogLevel INFO
          EOF

          echo "🔍 Validando sshd..."

          sudo sshd -t

          echo "🧹 Parando instâncias antigas..."

          sudo systemctl stop ssh 2>/dev/null || true
          sudo systemctl stop sshd 2>/dev/null || true

          sudo pkill -x sshd 2>/dev/null || true

          sleep 1

          echo "🚀 Iniciando sshd..."

          sudo /usr/sbin/sshd

          echo "✅ sshd iniciado"

          sudo ss -lntp | grep ":$SSH_PORT" || true

      # ============================================================
      # 6. Esperar SSH
      # ============================================================
      - name: Aguardar SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "⏳ Aguardando localhost:$SSH_PORT..."

          for i in {1..30}; do
            if nc -z 127.0.0.1 "$SSH_PORT"; then
              echo "✅ SSH está escutando"
              exit 0
            fi

            sleep 1
          done

          echo "❌ SSH não abriu a porta."

          sudo ss -lntp || true
          sudo journalctl -u ssh --no-pager -n 100 2>/dev/null || true

          exit 1

      # ============================================================
      # 7. Testar SSH local
      # ============================================================
      - name: Testar SSH local
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$SSH_KEY" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "$SSH_USER@127.0.0.1" \
            'echo SSH_LOCAL_OK; whoami; hostname; uname -a'

          echo "✅ SSH local funcionando"

      # ============================================================
      # 8. Iniciar Bore
      # ============================================================
      - name: Iniciar Bore
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$RUNNER_TEMP/bore.log"

          rm -f "$LOG"
          touch "$LOG"

          echo "🚀 Iniciando Bore..."
          echo "Local: 127.0.0.1:$SSH_PORT"
          echo "Remote: $BORE_HOST"

          bore local "$SSH_PORT" \
            --local-host 127.0.0.1 \
            --to "$BORE_HOST" \
            > "$LOG" 2>&1 &

          BORE_PID=$!

          echo "BORE_PID=$BORE_PID" >> "$GITHUB_ENV"
          echo "BORE_LOG=$LOG" >> "$GITHUB_ENV"

          PUBLIC_PORT=""

          # ========================================================
          # Esperar o endereço público real
          # ========================================================
          for i in {1..45}; do

            echo "⏳ Bore: tentativa $i/45"

            # Processo morreu?
            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo "❌ Bore encerrou."

              echo
              echo "========== BORE LOG =========="
              cat "$LOG" || true
              echo "==============================="

              exit 1
            fi

            # Formato documentado:
            #
            # bore.pub:12345
            #
            PUBLIC_PORT=$(
              grep -oE \
                'bore\.pub:[0-9]+' \
                "$LOG" \
                | head -n 1 \
                | cut -d ':' -f 2 \
                || true
            )

            if [[ "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
              break
            fi

            sleep 1
          done

          echo
          echo "========== BORE LOG =========="
          cat "$LOG" || true
          echo "==============================="

          if ! [[ "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
            echo
            echo "❌ Bore iniciou, mas não anunciou uma porta válida."
            echo
            echo "Verifique o log acima."
            exit 1
          fi

          echo "PUBLIC_PORT=$PUBLIC_PORT" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "           BORE ONLINE"
          echo "=========================================="
          echo "Host : $BORE_HOST"
          echo "Port : $PUBLIC_PORT"
          echo "=========================================="

      # ============================================================
      # 9. Testar porta pública
      # ============================================================
      - name: Testar conectividade Bore
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "🔎 Testando $BORE_HOST:$PUBLIC_PORT"

          CONNECTED="false"

          for i in {1..30}; do

            if nc \
              -z \
              -w 5 \
              "$BORE_HOST" \
              "$PUBLIC_PORT"; then

              CONNECTED="true"
              echo "✅ Porta pública acessível"
              break
            fi

            echo "⏳ Ainda não acessível ($i/30)"
            sleep 2
          done

          if [ "$CONNECTED" != "true" ]; then
            echo "❌ Porta Bore não está acessível."

            echo
            echo "========== BORE LOG =========="
            cat "$BORE_LOG" || true
            echo "==============================="

            exit 1
          fi

      # ============================================================
      # 10. SSH através do Bore
      # ============================================================
      - name: Testar SSH pelo Bore
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "🔐 Testando SSH via Bore..."

          ssh \
            -i "$SSH_KEY" \
            -p "$PUBLIC_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            "$SSH_USER@$BORE_HOST" \
            '
              echo "================================"
              echo "SSH VIA BORE FUNCIONANDO"
              echo "================================"
              echo "Usuário : $(whoami)"
              echo "Host    : $(hostname)"
              echo "Kernel  : $(uname -sr)"
              echo "Data    : $(date -u)"
              echo "================================"
            '

          echo "✅ SSH remoto funcionando"

      # ============================================================
      # 11. Gerar configuração de conexão
      # ============================================================
      - name: Mostrar conexão
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "======================================================"
          echo "                 SSH VIA BORE"
          echo "======================================================"
          echo
          echo "Host:"
          echo "  $BORE_HOST"
          echo
          echo "Porta:"
          echo "  $PUBLIC_PORT"
          echo
          echo "Usuário:"
          echo "  $SSH_USER"
          echo
          echo "Comando:"
          echo
          echo "  ssh -i ~/.ssh/bore_key \\"
          echo "      -p $PUBLIC_PORT \\"
          echo "      $SSH_USER@$BORE_HOST"
          echo
          echo "======================================================"

      # ============================================================
      # 12. Manter túnel
      # ============================================================
      - name: Manter Bore ativo
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            echo "🧹 Limpando..."

            if [ -n "${BORE_PID:-}" ]; then
              kill "$BORE_PID" 2>/dev/null || true
            fi

            sudo pkill -x sshd 2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          echo "🔄 Bore permanece ativo."
          echo "PID : $BORE_PID"
          echo "Host: $BORE_HOST"
          echo "Port: $PUBLIC_PORT"

          while kill -0 "$BORE_PID" 2>/dev/null; do
            sleep 10
          done

          echo "❌ Bore encerrou inesperadamente."

          cat "$BORE_LOG" || true

          exit 1
