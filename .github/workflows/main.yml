- name: Iniciar Bore
  shell: bash
  run: |
    set -euo pipefail

    LOG="/tmp/bore_output.txt"

    rm -f "$LOG"
    touch "$LOG"

    echo "🚀 Starting Bore..."

    bore local 22 --to bore.pub >"$LOG" 2>&1 &
    BORE_PID=$!

    echo "BORE_PID=$BORE_PID" >> "$GITHUB_ENV"

    for i in {1..30}; do
      if ! kill -0 "$BORE_PID" 2>/dev/null; then
        echo "❌ Bore process died."
        cat "$LOG" || true
        exit 1
      fi

      # Tenta capturar:
      # bore.pub:12345
      # bore.pub 12345
      # port 12345
      PUBLIC_PORT=$(
        sed -nE \
          -e 's/.*bore\.pub:([0-9]+).*/\1/p' \
          -e 's/.*port[[:space:]]+([0-9]+).*/\1/p' \
          "$LOG" \
        | head -n1
      )

      if [[ "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
        echo "✅ Public port: $PUBLIC_PORT"
        break
      fi

      sleep 1
    done

    if ! [[ "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
      echo "❌ Failed to obtain Bore public port."
      echo
      echo "===== BORE LOG ====="
      cat "$LOG"
      echo "===================="
      exit 1
    fi

    {
      echo "PUBLIC_HOST=bore.pub"
      echo "PUBLIC_PORT=$PUBLIC_PORT"
    } >> "$GITHUB_ENV"

    echo "✅ PUBLIC_HOST=bore.pub"
    echo "✅ PUBLIC_PORT=$PUBLIC_PORT"
